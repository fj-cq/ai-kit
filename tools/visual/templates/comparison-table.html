<!--
  模板：对比表格 (comparison_table)
  类型：P1 数据图表
  适用：多维度对比、方案选型
-->
<div class="chart-table" style="
  padding: 24px;
  background: var(--bg-card, #ffffff);
  border: 1px solid var(--border, #eaeaea);
  border-radius: var(--radius, 12px);
  overflow-x: auto;
">
  <div style="font-weight: 600; font-size: 14px; color: var(--text-secondary, #666); margin-bottom: 16px; text-align: center;">
    三种供应链策略对比
  </div>
  <table style="width: 100%; border-collapse: collapse; font-size: 13px; min-width: 400px;">
    <thead>
      <tr>
        <th style="padding: 10px 12px; text-align: left; border-bottom: 2px solid var(--accent, #6366f1); color: var(--text, #333); font-weight: 700;">维度</th>
        <th style="padding: 10px 12px; text-align: center; border-bottom: 2px solid var(--accent, #6366f1); color: var(--text, #333); font-weight: 700;">精益模式</th>
        <th style="padding: 10px 12px; text-align: center; border-bottom: 2px solid var(--accent, #6366f1); color: var(--text, #333); font-weight: 700;">冗余模式</th>
        <th style="padding: 10px 12px; text-align: center; border-bottom: 2px solid var(--accent, #6366f1); color: var(--accent, #6366f1); font-weight: 700;">弹性模式</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td style="padding: 10px 12px; border-bottom: 1px solid var(--border, #eee); color: var(--text, #333); font-weight: 600;">成本</td>
        <td style="padding: 10px 12px; border-bottom: 1px solid var(--border, #eee); text-align: center; color: var(--text-secondary, #888);">最低</td>
        <td style="padding: 10px 12px; border-bottom: 1px solid var(--border, #eee); text-align: center; color: var(--text-secondary, #888);">最高</td>
        <td style="padding: 10px 12px; border-bottom: 1px solid var(--border, #eee); text-align: center; color: var(--accent, #6366f1); font-weight: 600;">中等</td>
      </tr>
      <tr>
        <td style="padding: 10px 12px; border-bottom: 1px solid var(--border, #eee); color: var(--text, #333); font-weight: 600;">韧性</td>
        <td style="padding: 10px 12px; border-bottom: 1px solid var(--border, #eee); text-align: center; color: var(--text-secondary, #888);">低</td>
        <td style="padding: 10px 12px; border-bottom: 1px solid var(--border, #eee); text-align: center; color: var(--text-secondary, #888);">高</td>
        <td style="padding: 10px 12px; border-bottom: 1px solid var(--border, #eee); text-align: center; color: var(--accent, #6366f1); font-weight: 600;">高</td>
      </tr>
      <tr>
        <td style="padding: 10px 12px; border-bottom: 1px solid var(--border, #eee); color: var(--text, #333); font-weight: 600;">响应速度</td>
        <td style="padding: 10px 12px; border-bottom: 1px solid var(--border, #eee); text-align: center; color: var(--text-secondary, #888);">慢</td>
        <td style="padding: 10px 12px; border-bottom: 1px solid var(--border, #eee); text-align: center; color: var(--text-secondary, #888);">中</td>
        <td style="padding: 10px 12px; border-bottom: 1px solid var(--border, #eee); text-align: center; color: var(--accent, #6366f1); font-weight: 600;">快</td>
      </tr>
      <tr>
        <td style="padding: 10px 12px; color: var(--text, #333); font-weight: 600;">适用场景</td>
        <td style="padding: 10px 12px; text-align: center; color: var(--text-secondary, #888);">稳定市场</td>
        <td style="padding: 10px 12px; text-align: center; color: var(--text-secondary, #888);">高价值品</td>
        <td style="padding: 10px 12px; text-align: center; color: var(--accent, #6366f1); font-weight: 600;">多变环境</td>
      </tr>
    </tbody>
  </table>
</div>
