<!--
  模板：漏斗图 (funnel)
  类型：P0 逻辑结构图
  适用：转化流程、筛选过程
-->
<div class="chart-funnel" style="
  padding: 24px;
  background: var(--bg-card, #ffffff);
  border: 1px solid var(--border, #eaeaea);
  border-radius: var(--radius, 12px);
">
  <div style="font-weight: 600; font-size: 14px; color: var(--text-secondary, #666); margin-bottom: 20px; text-align: center;">
    供应商筛选漏斗
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
    <!-- Stage 1 (widest) -->
    <div style="
      width: 90%;
      padding: 12px 16px;
      background: var(--tag-bg, #f0f0f0);
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text, #333);
    ">
      <span style="font-weight: 600;">初始候选池</span>
      <span style="color: var(--text-secondary, #888);">200 家</span>
    </div>
    <!-- Stage 2 -->
    <div style="
      width: 72%;
      padding: 12px 16px;
      background: var(--highlight-bg, #f5f3ff);
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text, #333);
    ">
      <span style="font-weight: 600;">资质审核</span>
      <span style="color: var(--text-secondary, #888);">85 家</span>
    </div>
    <!-- Stage 3 -->
    <div style="
      width: 54%;
      padding: 12px 16px;
      background: var(--highlight-bg, #f5f3ff);
      border: 1px solid var(--border, #e0e0e0);
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text, #333);
    ">
      <span style="font-weight: 600;">实地考察</span>
      <span style="color: var(--text-secondary, #888);">30 家</span>
    </div>
    <!-- Stage 4 (narrowest, accent) -->
    <div style="
      width: 36%;
      padding: 12px 16px;
      background: var(--accent, #6366f1);
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #ffffff;
    ">
      <span style="font-weight: 700;">最终入围</span>
      <span style="opacity: 0.85;">8 家</span>
    </div>
  </div>
</div>
