<!--
  模板：金字塔图 (pyramid)
  类型：P0 逻辑结构图
  适用：层级关系、从底到顶的递进结构
-->
<div class="chart-pyramid" style="
  padding: 24px;
  background: var(--bg-card, #ffffff);
  border: 1px solid var(--border, #eaeaea);
  border-radius: var(--radius, 12px);
">
  <div style="font-weight: 600; font-size: 14px; color: var(--text-secondary, #666); margin-bottom: 20px; text-align: center;">
    数据能力成熟度金字塔
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
    <!-- Level 1 (Top) -->
    <div style="
      width: 35%;
      padding: 12px 16px;
      background: var(--accent, #6366f1);
      color: #ffffff;
      text-align: center;
      border-radius: 6px 6px 0 0;
      font-size: 13px;
      line-height: 1.4;
    ">
      <div style="font-weight: 700;">决策支持</div>
      <div style="font-size: 11px; opacity: 0.85;">AI 驱动的预测性决策</div>
    </div>
    <!-- Level 2 -->
    <div style="
      width: 60%;
      padding: 12px 16px;
      background: var(--highlight-bg, #f5f3ff);
      border: 1px solid var(--border, #e0e0e0);
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
      color: var(--text, #333);
    ">
      <div style="font-weight: 700;">分析能力</div>
      <div style="font-size: 11px; color: var(--text-secondary, #888);">BI 报表 + 统计建模</div>
    </div>
    <!-- Level 3 (Bottom) -->
    <div style="
      width: 85%;
      padding: 12px 16px;
      background: var(--tag-bg, #f0f0f0);
      border: 1px solid var(--border, #e0e0e0);
      border-radius: 0 0 6px 6px;
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
      color: var(--text, #333);
    ">
      <div style="font-weight: 700;">数据基础设施</div>
      <div style="font-size: 11px; color: var(--text-secondary, #888);">数据仓库 + ETL + 数据治理</div>
    </div>
  </div>
</div>
