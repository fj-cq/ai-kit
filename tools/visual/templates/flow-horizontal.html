<!--
  模板：水平流程图 (flow_horizontal)
  类型：P0 逻辑结构图
  使用方式：替换 {{TITLE}}、{{NODES}}、{{ACCENT_COLOR}} 等占位符
  示例数据内嵌于下方
-->
<div class="chart-flow-h" style="
  padding: 24px;
  background: var(--bg-card, #ffffff);
  border: 1px solid var(--border, #eaeaea);
  border-radius: var(--radius, 12px);
  overflow-x: auto;
">
  <div style="font-weight: 600; font-size: 14px; color: var(--text-secondary, #666); margin-bottom: 16px; text-align: center;">
    供应链韧性演进路径
  </div>
  <div style="display: flex; align-items: center; justify-content: center; gap: 0; min-width: 500px; padding: 8px 0;">
    <!-- Node 1 -->
    <div style="
      flex: 0 0 auto;
      padding: 14px 20px;
      background: var(--bg-card, #f5f5f7);
      border: 1px solid var(--border, #e0e0e0);
      border-radius: 10px;
      text-align: center;
      min-width: 120px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text, #333);
    ">
      <div style="font-weight: 700; margin-bottom: 4px;">效率优先</div>
      <div style="font-size: 12px; color: var(--text-secondary, #888);">精益生产</div>
    </div>
    <!-- Arrow -->
    <div style="flex: 0 0 auto; padding: 0 8px; display: flex; flex-direction: column; align-items: center;">
      <div style="font-size: 10px; color: var(--text-secondary, #999); margin-bottom: 4px; white-space: nowrap;">黑天鹅冲击</div>
      <div style="width: 48px; height: 2px; background: var(--accent, #6366f1); position: relative;">
        <div style="position: absolute; right: -4px; top: -4px; width: 0; height: 0; border-left: 8px solid var(--accent, #6366f1); border-top: 5px solid transparent; border-bottom: 5px solid transparent;"></div>
      </div>
    </div>
    <!-- Node 2 -->
    <div style="
      flex: 0 0 auto;
      padding: 14px 20px;
      background: var(--bg-card, #f5f5f7);
      border: 1px solid var(--border, #e0e0e0);
      border-radius: 10px;
      text-align: center;
      min-width: 120px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--text, #333);
    ">
      <div style="font-weight: 700; margin-bottom: 4px;">风险对冲</div>
      <div style="font-size: 12px; color: var(--text-secondary, #888);">多元供应商</div>
    </div>
    <!-- Arrow -->
    <div style="flex: 0 0 auto; padding: 0 8px; display: flex; flex-direction: column; align-items: center;">
      <div style="font-size: 10px; color: var(--text-secondary, #999); margin-bottom: 4px; white-space: nowrap;">数字化赋能</div>
      <div style="width: 48px; height: 2px; background: var(--accent, #6366f1); position: relative;">
        <div style="position: absolute; right: -4px; top: -4px; width: 0; height: 0; border-left: 8px solid var(--accent, #6366f1); border-top: 5px solid transparent; border-bottom: 5px solid transparent;"></div>
      </div>
    </div>
    <!-- Node 3 (accent) -->
    <div style="
      flex: 0 0 auto;
      padding: 14px 20px;
      background: var(--accent, #6366f1);
      border: 1px solid var(--accent, #6366f1);
      border-radius: 10px;
      text-align: center;
      min-width: 120px;
      font-size: 13px;
      line-height: 1.5;
      color: #ffffff;
    ">
      <div style="font-weight: 700; margin-bottom: 4px;">韧性优先</div>
      <div style="font-size: 12px; opacity: 0.85;">弹性网络</div>
    </div>
  </div>
</div>
