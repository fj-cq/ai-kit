<!--
  模板：因果链 (cause_effect)
  类型：P2 关系图
  适用：因果分析、连锁反应、根因分析
  纯 CSS 实现
-->
<div class="chart-cause-effect" style="
  padding: 24px;
  background: var(--bg-card, #ffffff);
  border: 1px solid var(--border, #eaeaea);
  border-radius: var(--radius, 12px);
">
  <div style="font-weight: 600; font-size: 14px; color: var(--text-secondary, #666); margin-bottom: 20px; text-align: center;">
    供应链中断的连锁效应
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; max-width: 320px; margin: 0 auto;">
    <!-- Cause -->
    <div style="
      width: 100%;
      padding: 12px 16px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
    ">
      <div style="font-weight: 700; color: #dc2626;">原因</div>
      <div style="color: var(--text, #333); margin-top: 2px;">关键供应商产能中断</div>
    </div>
    <!-- Down arrow -->
    <div style="color: var(--text-secondary, #ccc); font-size: 18px; line-height: 1;">&darr;</div>
    <!-- Effect 1 -->
    <div style="
      width: 100%;
      padding: 12px 16px;
      background: var(--tag-bg, #f0f0f0);
      border: 1px solid var(--border, #e0e0e0);
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
    ">
      <div style="font-weight: 700; color: var(--text, #333);">一级影响</div>
      <div style="color: var(--text-secondary, #888); margin-top: 2px;">原材料短缺，交期延长 2-4 周</div>
    </div>
    <!-- Down arrow -->
    <div style="color: var(--text-secondary, #ccc); font-size: 18px; line-height: 1;">&darr;</div>
    <!-- Effect 2 -->
    <div style="
      width: 100%;
      padding: 12px 16px;
      background: var(--tag-bg, #f0f0f0);
      border: 1px solid var(--border, #e0e0e0);
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
    ">
      <div style="font-weight: 700; color: var(--text, #333);">二级影响</div>
      <div style="color: var(--text-secondary, #888); margin-top: 2px;">下游客户订单堆积，满意度下降</div>
    </div>
    <!-- Down arrow -->
    <div style="color: var(--text-secondary, #ccc); font-size: 18px; line-height: 1;">&darr;</div>
    <!-- Resolution (accent) -->
    <div style="
      width: 100%;
      padding: 12px 16px;
      background: var(--accent, #6366f1);
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      color: #ffffff;
    ">
      <div style="font-weight: 700;">应对措施</div>
      <div style="margin-top: 2px; opacity: 0.9;">启动备用供应商 + 紧急调拨 + 客户沟通</div>
    </div>
  </div>
</div>
