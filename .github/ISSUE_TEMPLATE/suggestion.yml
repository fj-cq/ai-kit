name: 能力建议
description: 提议新的提示词、工具、工作流或文档改进
title: "[建议] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 说明使用者、任务和当前困难，请勿附私人或公司资料。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样使用，得到什么结果
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已有方法、参考来源或约束
      description: 如涉及第三方内容，请说明来源与授权情况。
